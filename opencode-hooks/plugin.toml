[plugin]
name = "opencode-hooks"
display_name = "OpenCode Agent Hooks"
description = "Wires OpenCode into Aphotic's v2 agent-hook contract for live per-session tracking in the bar/dashboard, same contract as Claude Code. Needs opencode >= 2.0.14."
version = "2.0.0"
author = "T-Crypt"
category = "ai"
capabilities = ["harness-hook"]

[requires]
binaries = ["opencode"]

[owns]
external_config = ["~/.config/opencode/plugins/aphotic_opencode_hook.js (symlink)"]

[harness]
wire = "hooks/wire.sh"
unwire = "hooks/unwire.sh"
