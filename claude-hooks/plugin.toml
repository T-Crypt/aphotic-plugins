[plugin]
name = "claude-hooks"
display_name = "Claude Code Agent Hooks"
description = "Wires Claude Code into Aphotic's agent-hook contract for live per-session tracking in the bar/dashboard, and claims the statusLine slot to read quota windows."
version = "1.2.0"
author = "T-Crypt"
category = "ai"
capabilities = ["harness-hook"]

[owns]
external_config = [
    "~/.claude/settings.json (SessionStart/UserPromptSubmit/PreToolUse/PostToolUse/PostToolUseFailure/Notification/PreCompact/PostCompact/Stop/SubagentStop/SessionEnd hook entries)",
    "~/.claude/settings.json (statusLine command, only when the slot is free)",
]

[harness]
wire = "hooks/wire.sh"
unwire = "hooks/unwire.sh"

[harness.claude]
label = "Claude Code"
icon = "smart_toy"
provider = "anthropic"
match = "claude"
launch = ["claude"]
usage = "scan"
scan = ".claude/projects/*/*.jsonl"
context = "statusline"
chat = true
instructions = ".claude/CLAUDE.md"
