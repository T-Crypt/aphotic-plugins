[plugin]
name = "agent-graph"
display_name = "Agent Graph"
description = "Live tool-call graph and run replay for AI coding harnesses (Claude Code, Codex)."
version = "1.6.0"
author = "T-Crypt"
category = "ai"
capabilities = ["ui-surface"]

[owns]
# Declares what this plugin's presence affects outside its own install
# directory, so `aphotic plugin list --json` (and a future audit) can
# show it -- not an automatic revert-on-remove list. These are inert once
# this plugin is gone (nothing else reads them), so leaving a stale value
# in shell.json causes no dead UI or drift; it just means a reinstall
# picks the same settings back up. See docs/archive/PLUGIN_SYSTEM.md
# manifest v3, "config_keys is informational."
config_keys = ["agentGraphQuality", "agentGraphAccent", "agentGraphEnabled", "agentGraphGroupByParent", "agentGraphHistoryLines"]

[ui.dashboard_tab]
id = "agentGraph"
icon = "account_tree"
label = "Agent Graph"
component = "qml/AgentGraphTab.qml"
# Was hardcoded in the shell's DashboardContent.qml as a per-plugin
# special case. It belongs here: the plugin states its own activation
# rule, and the shell evaluates it without knowing which plugin asked.
requires_layer = "ai"
requires_data = "harness"
