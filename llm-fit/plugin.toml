[plugin]
name = "llm-fit"
display_name = "Hardware Advisor"
description = "Hardware-aware local model recommendations from llmfit, with a one-click Ollama pull for the tags it confirms are real."
version = "1.1.0"
author = "T-Crypt"
category = "ai"
capabilities = ["ui-surface", "cli"]

# The whole feature is a wrapper around a binary Aphotic does not bundle
# and cannot install for you -- with `llmfit` absent there is nothing to
# scan and nothing to recommend. Declared here so `aphotic plugin list`
# reports it as a missing binary instead of the pane reporting it as its
# own permanent error state.
[requires]
binaries = ["llmfit"]

[owns]
# Nothing. Scan results are per-session state in LlmFitService, and the
# one action offered (a model pull) is Ollama's, written to Ollama's own
# store by core's AiProviders. Removing this plugin leaves no key behind.
config_keys = []

# `aphotic ai fit`, which lived in core's cmd_ai.sh because there was no
# way for a plugin to contribute one. Core resolves this by declaration --
# it asks who provides `ai fit`, never whether this plugin is installed --
# so the command appears and disappears with the plugin, and cmd_ai.sh
# names nothing.
[cli]
command = "ai"
subcommand = "fit"
script = "cli/ai_fit.sh"
summary = "Hardware-aware model recommendations via llmfit (default top 3)"

[ui.settings_pane]
id = "llmFit"
icon = "memory"
label = "Hardware Advisor"
component = "qml/LlmFitPane.qml"
# Docks into the AI category's pane as a collapsed section rather than
# claiming a rail entry: the Settings rail is a fixed length by design.
parent = "ai"
requires_layer = "ai"
