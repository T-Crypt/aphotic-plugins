# cava configuration for Aphotic's Spectrum overlay.
#
# sleep_timer is the load-bearing line. cava stops sampling and stops
# writing frames once its input has been idle for this long, and wakes on
# its own when samples come back, so a suspended PipeWire sink costs
# nothing on either side of the pipe. The shell's own gating sits on top
# of this, not instead of it.

[general]
framerate = 60
bars = 96
autosens = 1
lower_cutoff_freq = 30
higher_cutoff_freq = 16000
sleep_timer = 3

[input]
method = pipewire
source = auto
sample_rate = 48000
sample_bits = 16
channels = mono
mono_option = average

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 32
