[plugin]
name = "llama-swap"
display_name = "AI Notch Tile"
description = "Notch tile for every local inference engine: which one is in use, each engine's loaded models and measured GPU memory, plus llama-swap's live generation stats, inference mode and unload controls."
version = "1.1.0"
author = "T-Crypt"
category = "ai"
capabilities = ["ui-surface"]

[ui.notch_tile]
id = "ai"
icon = "memory"
label = "AI"
component = "qml/LlamaSwapNotchTile.qml"
requires_layer = "ai"

[requires]
binaries = ["curl", "pgrep"]
